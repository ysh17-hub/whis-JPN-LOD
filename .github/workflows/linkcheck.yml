name: linkcheck

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install rdflib pyshacl
      - name: check links
        run: python scripts/check_links.py
      - name: build
        run: python lod.py build
      - name: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs README.md LICENSE data/point_terrain.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "link check"
            git push
          fi
